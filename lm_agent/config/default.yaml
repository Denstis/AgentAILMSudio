# Конфигурация по умолчанию для LM Agent
# Сохраните как ~/.lm_agent/config.yaml или в директории проекта

# ─────────────────────────────────────────────────────────────────────────────
# Настройки подключения к LLM
# ─────────────────────────────────────────────────────────────────────────────
llm:
  # URL сервера LM Studio
  base_url: "http://localhost:1234/v1"
  
  # Модель по умолчанию
  model_name: "codellama-7b"
  
  # Параметры генерации
  temperature: 0.7
  max_tokens: 4096
  top_p: 0.9
  frequency_penalty: 0.5
  
  # Таймаут запроса (сек)
  request_timeout: 120

# ─────────────────────────────────────────────────────────────────────────────
# Настройки агента
# ─────────────────────────────────────────────────────────────────────────────
agent:
  # Максимальное количество итераций для решения задачи
  max_iterations: 50
  
  # Пауза между итерациями (сек)
  iteration_delay: 0.5
  
  # Включить подробное логирование
  verbose: true

# ─────────────────────────────────────────────────────────────────────────────
# Настройки песочницы
# ─────────────────────────────────────────────────────────────────────────────
sandbox:
  # Директория для выполнения кода
  work_dir: "~/lm_agent_sandbox"
  
  # Таймаут выполнения кода (сек)
  timeout: 1800
  
  # Разрешения
  enable_internet: false
  enable_system_cmds: false
  enable_pip: true
  enable_git: false
  enable_venv: false
  enable_all_modules: false
  
  # Разрешённые группы модулей
  enable_math: true
  enable_science: true
  enable_testing: true
  enable_gui: false
  enable_network: false
  
  # Пользовательские разрешённые модули (через запятую)
  custom_allowed_modules: ""
  
  # Пользовательские запрещённые паттерны (regex, через запятую)
  custom_forbidden_patterns: ""
  
  # Настройки pip
  pip_index_url: "https://pypi.org/simple"
  max_pip_timeout: 120
  
  # Настройки git
  max_git_timeout: 300
  
  # Разрешить доступ к локальным файлам
  allow_local_files: true

# ─────────────────────────────────────────────────────────────────────────────
# Настройки логирования
# ─────────────────────────────────────────────────────────────────────────────
logging:
  # Директория для логов
  log_dir: "~/.lm_agent"
  
  # Уровень логирования для файла
  file_level: "DEBUG"
  
  # Уровень логирования для консоли
  console_level: "INFO"
  
  # Включить JSON форматирование
  enable_json: false
  
  # Включить цвета в консоли
  enable_colors: true

# ─────────────────────────────────────────────────────────────────────────────
# Настройки GUI
# ─────────────────────────────────────────────────────────────────────────────
gui:
  # Тема оформления: "light" или "dark"
  theme: "light"
  
  # Шрифт для редактора кода
  code_font: "Consolas"
  code_font_size: 10
  
  # Размер окна по умолчанию
  window_width: 1200
  window_height: 800
  
  # Показывать тулбар
  show_toolbar: true
  
  # Автосохранение задач
  autosave: true

# ─────────────────────────────────────────────────────────────────────────────
# Расширенные настройки
# ─────────────────────────────────────────────────────────────────────────────
advanced:
  # Использовать асинхронные операции
  use_async: false
  
  # Кэширование импортов
  cache_imports: true
  cache_size: 128
  
  # Максимальный размер кэша выполнения (МБ)
  max_cache_size_mb: 100
  
  # Ограничение памяти для выполнения (МБ, 0 = без ограничений)
  memory_limit_mb: 0
  
  # Ограничение вывода (символов)
  output_limit: 100000
